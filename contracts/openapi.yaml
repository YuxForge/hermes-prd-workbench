          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/review/issues/{issueId}/assign:
    post:
      tags: [Review]
      operationId: assignReviewIssue
      summary: Reassign issue (Owner or Assignee)
      parameters:
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignReviewIssueRequest'
      responses:
        '200':
          description: Issue reassigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewIssueDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/review/issues/{issueId}/actions:
    post:
      tags: [Review]
      operationId: executeReviewIssueAction
      summary: Execute status action (Propose resolution, Confirm, Reject, Reopen, Cancel, Restore)
      parameters:
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewIssueActionRequest'
      responses:
        '200':
          description: Action executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewIssueDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/review/issues/{issueId}/anchors:
    post:
      tags: [Review]
      operationId: addReviewAnchor
      summary: Add a relocated anchor
      parameters:
        - $ref: '#/components/parameters/IssueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddReviewAnchorRequest'
      responses:
        '201':
          description: Anchor added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewAnchorDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/v1/review/issues/{issueId}/watch:
    post:
      tags: [Review]
      operationId: watchReviewIssue
      summary: Watch an issue
      parameters:
        - $ref: '#/components/parameters/IssueId'
      responses:
        '204':
          description: Watched
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Review]
      operationId: unwatchReviewIssue
      summary: Unwatch an issue
      parameters:
        - $ref: '#/components/parameters/IssueId'
      responses:
        '204':
          description: Unwatched
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/review/notifications:
    get:
      tags: [Review]
      operationId: getReviewNotifications
      summary: Get review notifications
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: page
          in: query
          required: false
          schema: { type: integer, default: 1, minimum: 1 }
        - name: pageSize
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Notifications list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewNotificationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/review/notifications/read:
    post:
      tags: [Review]
      operationId: markReviewNotificationsRead
      summary: Mark notifications as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkReviewNotificationsReadRequest'
      responses:
        '204':
          description: Marked as read
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    SessionToken:
      type: http
      scheme: bearer
    PluginKey:
      type: apiKey
      in: header
      name: X-PRD-Plugin-Key
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    RoundId:
      name: roundId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    IssueId:
      name: issueId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
    MemberUserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        maxLength: 64
  schemas:
    ClientEventRequest:
      type: object
      required: [module, action]
      properties:
        eventType: {type: string, enum: [USER_ACTION, CLIENT_ERROR]}
        module: {type: string, maxLength: 32, pattern: '^[A-Z_]+$'}
        action: {type: string, maxLength: 64, pattern: '^[A-Z_]+$'}
        status: {type: string, enum: [SUCCEEDED, FAILED, PENDING, RUNNING]}
        durationMs: {type: integer, minimum: 0, maximum: 86400000}
        errorCode: {type: string, maxLength: 64, pattern: '^[A-Z][A-Z0-9_]*$'}
        errorMessage: {type: string, maxLength: 500, description: Discarded; never persisted}
        metadata:
          type: object
          maxProperties: 10
          description: Only bounded taskId/runId, completeness and source/file counts are retained
    MonitoredFailureStat:
      type: object
      required: [module, errorCode, count, lastOccurredAt]
      properties:
        module:
          type: string
          enum: [GENERATE, POC, TEST_CASE, TECH_SPEC, REVIEW]
        errorCode:
          type: string
        count:
          type: integer
          format: int64
        lastOccurredAt:
          type: string
          format: date-time
    MonitoredFailure:
      type: object
      required: [id, taskId, module, action, createdAt]
      properties:
        id:
          type: string
          description: Run ID
        taskId:
          type: string
        taskTitle:
          type: [string, 'null']
        userId:
          type: [string, 'null']
        username:
          type: [string, 'null']
        module:
          type: string
          enum: [GENERATE, POC, TEST_CASE, TECH_SPEC, REVIEW]
        action:
          type: string
          const: RUN_FAILED
        errorCode:
          type: [string, 'null']
        errorMessage:
          type: [string, 'null']
        createdAt:
          type: string
          format: date-time
          description: Failure finish time
    AdminDashboardResponse:
      type: object
      required: [overview, users, features, errorStats, recentErrors]
      properties:
        overview:
          type: object
          required: [totalUsers, activeUsersToday, totalTasks, totalRuns, totalRunsSucceeded, totalRunsFailed, successRate, totalErrors]
          properties:
            totalUsers: { type: integer, format: int64 }
            activeUsersToday: { type: integer, format: int64 }
            totalTasks: { type: integer, format: int64 }
            totalRuns: { type: integer, format: int64 }
            totalRunsSucceeded: { type: integer, format: int64 }
            totalRunsFailed: { type: integer, format: int64 }
            successRate: { type: number }
            totalErrors:
              type: integer
              format: int64
              description: All-time failed runs in the five monitored modes
        users:
          type: array
          items: { type: object }
        features:
          type: array
          items: { type: object }
        errorStats:
          type: array
          items:
            $ref: '#/components/schemas/MonitoredFailureStat'
        recentErrors:
          type: array
          items:
            $ref: '#/components/schemas/MonitoredFailure'
    RunMode:
      type: string
      description: >-
        Run mode. GENERATE writes the PRD. Other modes prefer the current draft when one exists;
        REVIEW, DEMO, POC, ESTIMATE, TEST_CASE, and TECH_SPEC can also start from uploaded materials
        without a preceding GENERATE run. POC produces a static multi-file admin demo.
      enum: [REVIEW, GENERATE, DEMO, POC, ESTIMATE, TEST_CASE, TECH_SPEC]
    HealthResponse:
      type: object
      required: [status, hermes]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        hermes:
          type: string
          enum: [CONNECTED, UNAVAILABLE]
    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 32
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: At least 8 Unicode characters and at most 72 UTF-8 bytes; overlong registration is rejected.
        displayName:
          type: string
          maxLength: 64
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          maxLength: 4096
          description: Valid requests longer than 72 UTF-8 bytes fail authentication (401); inputs exceeding 4096 characters are rejected as invalid (400). No truncation or normalization.
    UserResponse:
      type: object
      required: [id, username, displayName]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
    AuthResponse:
      type: object
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserResponse'
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
    RenameTaskRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
      additionalProperties: false
    DemoSkill:
      type: object
      required: [id, name, description]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
    DemoPackageFiles:
      type: object
      description: >-
        Optional UTF-8 text attachments; no private host protocol or build guarantee. The browser
        displays and zips these files locally; the full DEMO payload, including html and this map,
        must not exceed 20 MiB (20,971,520 bytes). The service rejects absolute paths, traversal,
        environment/credential files, non-text values, and obvious credential assignments.
      propertyNames:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '^(?!/)(?![A-Za-z]:)(?!.*\\)(?!.*//)(?!.*\/$)(?!.*(^|/)\.\.?(/|$)).+$'
      additionalProperties:
        type: string
    DemoResultPayload:
      type: object
      required: [mode, title, summary, html]
      properties:
        mode:
          const: DEMO
        title:
          type: string
          minLength: 1
          maxLength: 200
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        html:
          type: string
          minLength: 1
        scriptMarkdown:
          type: string
          maxLength: 30000
        skill:
          type: string
          maxLength: 64
          default: generic-admin-html
        package_files:
          $ref: '#/components/schemas/DemoPackageFiles'
      not:
        required: [packageFiles]
      additionalProperties: true
    QualityOption:
      type: object
      required: [id, name, description, default]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        costHint:
          type: string
        default:
          type: boolean
    QualityOptions:
      type: object
      required: [completeness, lenses]
      properties:
        completeness:
          type: array
          items:
            $ref: '#/components/schemas/QualityOption'
        lenses:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/QualityOption'
    TaskResponse:
      type: object
      required: [id, title, sources, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        sources:
          type: array
          items:
            $ref: '#/components/schemas/SourceResponse'
        createdAt:
          type: string
          format: date-time
    TaskSummary:
      type: object
      required: [id, title, createdAt]
      properties:
        id:
          type: string
        title:
          type: string
        createdAt:
          type: string
          format: date-time
    SourceResponse:
      type: object
      required: [id, taskId, name, mediaType, size, status, createdAt]
      properties:
        id:
          type: string
        taskId:
          type: string
        name:
          type: string
        mediaType:
          type: string
        size:
          type: integer
          format: int64
        status:
          type: string
          enum: [READY, FAILED]
        createdAt:
          type: string
          format: date-time
    DraftSourceResponse:
      type: object
      required: [sourceId, runId, content, updatedAt]
      properties:
        sourceId:
          type: string
          maxLength: 64
        runId:
          type: string
          maxLength: 64
        content:
          type: string
          minLength: 1
          maxLength: 500000
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    UpdateDraftSourceRequest:
      type: object
      required: [content, expectedUpdatedAt]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 500000
          description: Saved verbatim after the service rejects content that is blank after trimming.
        expectedUpdatedAt:
          type: string
          format: date-time
      additionalProperties: false
    ToolSourceSummary:
      type: object
      required: [sourceId, name, size]
      properties:
        sourceId:
          type: string
        name:
          type: string
        size:
          type: integer
          format: int64
    CreateRunRequest:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: '#/components/schemas/RunMode'
        instruction:
          type: string
          maxLength: 4000
          default: ''
        skill:
          type: string
          maxLength: 64
          description: Demo style skill id, default generic-admin-html
          default: generic-admin-html
        completeness:
          type: string
          enum: [QUICK, STANDARD, THOROUGH]
          default: STANDARD
          description: Output completeness. Omitted values default to STANDARD.
        lenses:
          type: array
          items:
            type: string
            maxLength: 64
          description: Optional focus lens ids. Omit to use mode defaults; send [] for none.
        reviseFromRunId:
          type: string
          maxLength: 64
          description: GENERATE only. Revise this succeeded GENERATE run instead of writing from scratch.
      additionalProperties: false
    RunResponse:
      type: object
      required: [id, taskId, mode, status, createdAt]
      properties:
        id:
          type: string
        taskId:
          type: string
        parentRunId:
          type: [string, 'null']
        mode:
          $ref: '#/components/schemas/RunMode'
        completeness:
          type: string
          enum: [QUICK, STANDARD, THOROUGH]
        lenses:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
        stage:
          type: [string, 'null']
          enum: [null, READING, ANALYZING, SUBMITTING]
        result:
          oneOf:
            - type: 'null'
            - type: object
              additionalProperties: true
        error:
          type: [string, 'null']
        accepted:
          type: boolean
          default: false
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
    RunHistoryItem:
      type: object
      required: [id, taskId, taskTitle, mode, status, createdAt]
      properties:
        id:
          type: string
        taskId:
          type: string
        taskTitle:
          type: string
        mode:
          $ref: '#/components/schemas/RunMode'
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED]
        summary:
          type: [string, 'null']
        error:
          type: [string, 'null']
        accepted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
    ReviewFeedbackItem:
      type: object
      required: [itemPath, action]
      properties:
        itemPath:
          type: string
          pattern: '^(blockingIssues|otherSuggestions)/(0|[1-9][0-9]*)$'
          maxLength: 100
        action:
          type: string
          enum: [EDITED, WONT_DO, NEEDS_CUSTOMER]
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: Omit when EDITED has no explanation; clients must not send an empty string
      allOf:
        - if:
            properties:
              action:
                enum: [WONT_DO, NEEDS_CUSTOMER]
            required: [action]
          then:
            required: [note]
      additionalProperties: false
    UpdateReviewFeedbackRequest:
      type: object
      description: Complete replacement payload; itemPath values must be unique within the items collection, and the serialized request is limited to 100 KB by the service.
      required: [expectedRevision, items]
      properties:
        expectedRevision:
          type: integer
          minimum: 0
        items:
          type: array
          maxItems: 150
          items:
            $ref: '#/components/schemas/ReviewFeedbackItem'
      additionalProperties: false
    ReviewFeedbackResponse:
      type: object
      required: [runId, revision, items]
      properties:
        runId:
          type: string
          maxLength: 64
        revision:
          type: integer
          minimum: 0
        items:
          type: array
          maxItems: 150
          items:
            $ref: '#/components/schemas/ReviewFeedbackItem'
      additionalProperties: false
    SourcePageResponse:
      type: object
      required: [sourceId, name, content]
      properties:
        sourceId:
          type: string
        name:
          type: string
        content:
          type: string
        nextCursor:
          type: [string, 'null']
    SubmitResultRequest:
      type: object
      required: [mode, payload]
      properties:
        mode:
          $ref: '#/components/schemas/RunMode'
        payload:
          oneOf:
            - $ref: '#/components/schemas/DemoResultPayload'
            - type: object
              required: [mode]
              properties:
                mode:
                  $ref: '#/components/schemas/RunMode'
                  not:
                    const: DEMO
              additionalProperties: true
          description: >-
            Result object for the requested mode. DEMO payloads are validated against
            DemoResultPayload; other mode schemas remain in the corresponding contracts/*.schema.json
            files. The complete DEMO payload has a hard limit of 20 MiB (20,971,520 bytes).
      additionalProperties: false
    ExportTestCaseColumn:
      type: object
      required: [key]
      properties:
        key:
          type: string
          maxLength: 64
          description: >-
            Column key. Known keys are index, caseId, module, subModule, title, type, priority,
            precondition, steps, testData, expectedResult, and description; any other key reads a
            matching custom field from each item.
        title:
          type: string
          maxLength: 100
          description: Header text; falls back to the default title for a known key, otherwise to key.
        visible:
          type: boolean
          default: true
          description: False removes the column. An empty or fully hidden list falls back to all default columns.
      additionalProperties: false
    ExportTestCaseRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          description: Workbook title and download filename stem; falls back to payload.title.
        columns:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ExportTestCaseColumn'
        customHeaders:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 100
          description: Extra header titles for custom fields carried on each item.
        extraFieldValues:
          type: object
          additionalProperties:
            type: string
    ExportTechSpecRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
          description: Markdown title and download filename stem; falls back to payload.title.
      additionalProperties: false
    UpdateLogItem:
      type: object
      required: [title, detail]
      properties:
        title:
          type: string
        detail:
          type: string
        type:
          type: string
          enum: [feature, improve, fix, security]
          default: feature
        tone:
          type: string
          enum: [accent, blue, amber]
          default: accent
      additionalProperties: false
    UpdateLog:
      type: object
      required: [id, version, releaseDate, title, summary, highlights, items, isLatest, status]
      properties:
        id:
          type: string
        version:
          type: string
        releaseDate:
          type: string
        title:
          type: string
        summary:
          type: string
        highlights:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpdateLogItem'
        isLatest:
          type: boolean
        status:
          type: string
          enum: [PUBLISHED, DRAFT]
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    UpdateLogSummaryResponse:
      type: object
      properties:
        latest:
          $ref: '#/components/schemas/UpdateLog'
        history:
          type: array
          items:
            $ref: '#/components/schemas/UpdateLog'
      additionalProperties: false
    CreateUpdateLogRequest:
      type: object
      required: [version, releaseDate, title, summary, items]
      properties:
        version:
          type: string
        releaseDate:
          type: string
        title:
          type: string
        summary:
          type: string
        highlights:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpdateLogItem'
        isLatest:
          type: boolean
        status:
          type: string
          enum: [PUBLISHED, DRAFT]
      additionalProperties: false
    UpdateUpdateLogRequest:
      type: object
      required: [version, releaseDate, title, summary, items]
      properties:
        version:
          type: string
        releaseDate:
          type: string
        title:
          type: string
        summary:
          type: string
        highlights:
          type: array
          items:
            type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpdateLogItem'
        isLatest:
          type: boolean
        status:
          type: string
          enum: [PUBLISHED, DRAFT]
      additionalProperties: false
    UpdateStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum: [PUBLISHED, DRAFT]
        isLatest:
          type: boolean
      additionalProperties: false
    ErrorResponse:
      type: object
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
    ReviewTodoCounts:
      type: object
      required: [assignedToMe, awaitingMyConfirm, awaitingProxyConfirm, unreadNotifications]
      properties:
        assignedToMe: { type: integer }
        awaitingMyConfirm: { type: integer }
        awaitingProxyConfirm: { type: integer }
        unreadNotifications: { type: integer }
    ReviewTaskSummary:
      type: object
      required: [taskId, title, role, todoCounts, createdAt, updatedAt]
      properties:
        taskId: { type: string }
        title: { type: string }
        role: { type: string, enum: [OWNER, EDITOR, REVIEWER, VIEWER] }
        todoCounts: { $ref: '#/components/schemas/ReviewTodoCounts' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ReviewTaskListResponse:
      type: object
      required: [items, total, page, pageSize, asOf]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ReviewTaskSummary' }
